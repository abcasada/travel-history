# Development overrides (used by ./dev). Adds the mock OIDC provider, Mailpit, the Vite dev
# server and a `tools` container, and binds dev ports to TRAVEL_LAN_BIND (the server's LAN
# address) so the stack is reachable over LAN/WireGuard only — never from the internet. The
# production stack is a separate project (compose.prod.yaml, ./dev prod …) with its own database.
# Worktree lanes (./dev lane new, D-98) set their own image tag and host ports in their .env;
# the defaults below are the main checkout's.

x-dev-backend: &dev-backend
  image: travel-history-backend-dev:${TRAVEL_DEV_IMAGE_TAG:-latest}
  build:
    context: .
    dockerfile: backend/Dockerfile
    target: dev
  volumes:
    - ./backend:/app
    - ${TRAVEL_BULK_DIR:?set in .env}:/bulk

services:
  migrate:
    <<: *dev-backend

  web:
    <<: *dev-backend
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    ports:
      - "127.0.0.1:${TRAVEL_WEB_PORT:-8780}:8000"
      - "${TRAVEL_LAN_BIND:-127.0.0.1}:${TRAVEL_WEB_PORT:-8780}:8000"
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_SECURE_COOKIES: "false"   # plain HTTP on the LAN; production is HTTPS-only
      # runserver uses a thread per request; with persistent connections each finished thread
      # left one idle (≈40 after e2e runs), starving the tests' connection slots.
      DB_CONN_MAX_AGE: "0"
      # Containers can't reach the host's LAN address (host firewall), so server-to-server
      # OIDC calls go to the mock provider directly (travel/accounts/oidc.py).
      OIDC_BACKCHANNEL_URL: http://oidc:8080
      # The hourly provider re-check (D-108) is off in development; a lane's .env may set a few
      # seconds for `./dev e2e --recheck` (D-120).
      OIDC_SESSION_RECHECK_SECONDS: ${OIDC_SESSION_RECHECK_SECONDS:-0}
      SMTP_HOST: mail
      SMTP_PORT: "1025"
      SMTP_USE_TLS: "false"

  worker:
    <<: *dev-backend
    # Restart the worker when backend code changes (runserver reloads itself; the worker doesn't).
    command: ["watchfiles", "--filter", "python", "python manage.py procrastinate worker", "/app"]
    environment:
      SMTP_HOST: mail
      SMTP_PORT: "1025"
      SMTP_USE_TLS: "false"

  # One-off commands and tests. Connects as the OWNER role (migrations, dataset loads, test
  # database creation); tests switch every query to travel_app themselves.
  tools:
    <<: *dev-backend
    profiles: ["tools"]
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    # ./data for the flight converter and importer (`data/private/...` paths, docs/flights);
    # synthetic fixtures read-only.
    volumes:
      - ./backend:/app
      - ${TRAVEL_BULK_DIR:?set in .env}:/bulk
      - ./data/private:/data/private
      - ./data/fixtures:/data/fixtures:ro
    environment:
      DB_HOST: db
      DB_NAME: travel
      DB_USER: travel_owner
      DB_PASSWORD: ${TRAVEL_OWNER_PASSWORD:?set in .env}
      DB_PUBLIC_USER: travel_public
      DB_PUBLIC_PASSWORD: ${TRAVEL_PUBLIC_PASSWORD:?set in .env}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set in .env}
      DJANGO_DEBUG: "false"
    networks: [internal, egress, valhalla]
    depends_on:
      db: { condition: service_healthy }
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:6.1.2
    environment:
      SERVER_PORT: "8080"
      JSON_CONFIG_PATH: /config/config.json
      LOG_LEVEL: WARN
    volumes:
      - ./devstack/oidc/config.json:/config/config.json:ro
    ports:
      - "${TRAVEL_LAN_BIND:-127.0.0.1}:${TRAVEL_OIDC_PORT:-8781}:8080"
    networks: [egress]
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m

  mail:
    image: axllent/mailpit:v1.29
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    ports:
      - "${TRAVEL_LAN_BIND:-127.0.0.1}:${TRAVEL_MAIL_PORT:-8782}:8025"
    networks: [internal, egress]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m

  frontend:
    image: node:24.22.0-trixie-slim@sha256:a6155384446670e9719bdc4fd0ebe4d4b29fb32a8d6aa523da3547a6cfbcf22c
    working_dir: /src
    command: ["npm", "run", "dev"]
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    environment:
      HOME: /tmp
      npm_config_update_notifier: "false"
      VITE_BACKEND_URL: http://web:8000
    volumes:
      - ./frontend:/src
    ports:
      - "${TRAVEL_LAN_BIND:-127.0.0.1}:${TRAVEL_VITE_PORT:-5173}:5173"
    networks: [internal, egress]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1280m   # Vite dev server sat at ~630 MiB (82% of the old 768m) in the 2026-10-21 audit
