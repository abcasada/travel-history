<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}Travel History{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; line-height: 1.5; color: #1f2933; }
    a.button, button { display: inline-block; padding: .6rem 1.1rem; border-radius: .4rem; background: #2563eb; color: #fff; text-decoration: none; border: 0; font: inherit; cursor: pointer; }
    .muted { color: #52606d; font-size: .9rem; }
  </style>
</head>
<body>{% block content %}{% endblock %}</body>
</html>
